# Board trial-dev of agentkit-trial: the flow definition (sushilife-agentkit .agentkit/boards/dev-flow.toml at its main,
# with this board's name and openers). Workers open PRs with plain git and gh; the board has no review or merging state.
# Apply: on the host, after this file is merged (workflows stand trial-dev).
# The flow board's definition (docs/decisions/2026-11-20-dev-simplify.md, second version, sections 1 and 8; user decision 269).
# No board runs it yet: board dev keeps .agentkit/boards/dev.toml. The switch is which workflow is stood on a board.
# It is .agentkit/boards/dev.toml without the states review and merging and every move that touches them.
# What is done on its changes: plugins/dev/devkit/CONTRACT.md section 3. The board only checks that the needed lines are there.
# Two reserved line names (core/kanban/CONTRACT.md, the board definition): result is also written to the card's
# result field, and ask is read by list --waiting. Do not use them for anything else.
# Labels are English here: this file is a declaration under the Hangul gate (tools/boundaries.py HANGUL_TABLE).
name = "trial-dev"
entry = ["todo", "backlog"]
# Addresses that may open a group and regroup cards: the same list as .agentkit/boards/dev.toml. Change both together.
openers = [
  "claude:e01e14c5-e77f-4b27-87bf-b8332a805de5", # repo
  "claude:e4b7c446-de26-4c04-ac94-f01d33f29d7c", # devflow
]
# Address prefixes not taken as the receiver of a question (ask): programs do not read a decide question.
unaskable = ["plugin:"]
# The skill relay names to a card that has no `skill` of its own: the worker skill of the flow board, which lives in
# the repository registered as `agentkit` (`@<repository>/<path>`: that repository's main checkout). A missing file
# fails the launch.
default_skill = "@agentkit/docs/skills/worker-dev/SKILL.md"
# No `ranked`: the only ranked column of dev.toml was merging, and nothing on a flow board reads a hand-set rank.

[[states]]
name = "backlog"
kind = "held"
label = "Backlog"
notify = []

[[states]]
name = "todo"
kind = "ready"
label = "Ready"
notify = []

[[states]]
name = "doing"
kind = "active"
label = "In progress"
notify = ["owner"]

[[states]]
name = "decide"
kind = "held"
label = "Decision needed"
notify = ["ask"]

[[states]]
name = "done"
kind = "end"
label = "Done"
notify = ["author"]

[[states]]
name = "cancelled"
kind = "cancel"
label = "Folded"
notify = []

[[moves]]
from = "todo"
to = "doing"
take = true

[[moves]]
from = "backlog"
to = "todo"

[[moves]]
from = "todo"
to = "backlog"
need = [["reason"]]

[[moves]]
from = "doing"
to = "decide"
need = [["question", "recommend", "ask"]]

[[moves]]
from = "decide"
to = "doing"
need = [["answer"]]

[[moves]]
from = "doing"
to = "todo"
need = [["reason"]]

# Goal reached (`dev done`, or `dev flow` once every PR of the card is merged and installed)
[[moves]]
from = "doing"
to = "done"
need = [["result"]]

[[moves]]
from = "backlog"
to = "cancelled"
need = [["folded"]]

[[moves]]
from = "todo"
to = "cancelled"
need = [["folded"]]

[[moves]]
from = "doing"
to = "cancelled"
need = [["folded"]]

[[moves]]
from = "decide"
to = "cancelled"
need = [["folded"]]
